name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK platform and build-tools
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME" || true
          ls "$ANDROID_HOME/cmdline-tools" || true
          java -version
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-22" "build-tools;30.0.3"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.6.4'

      - name: Generate Gradle wrapper files for the Ant-style Ninja project
        run: |
          cat > settings.gradle <<'EOF'
          rootProject.name = 'Ai_Agent'
          include ':app'
          project(':app').projectDir = file('Ninja')
          EOF

          cat > build.gradle <<'EOF'
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:7.4.2'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          cat > Ninja/build.gradle <<'EOF'
          apply plugin: 'com.android.application'

          android {
              namespace 'io.github.mthli.Ninja'
              compileSdkVersion 22
              buildToolsVersion '30.0.3'

              defaultConfig {
                  minSdkVersion 16
                  targetSdkVersion 22
                  versionCode 100 + Integer.parseInt(System.getenv('RUN_NUMBER') ?: '0')
                  versionName '1.0'
              }

              sourceSets {
                  main {
                      manifest.srcFile 'AndroidManifest.xml'
                      java.srcDirs = ['src']
                      res.srcDirs = ['res']
                      assets.srcDirs = ['assets']
                  }
              }

              signingConfigs {
                  ninja {
                      storeFile file(System.getenv('KEYSTORE_FILE') ?: 'missing.p12')
                      storePassword System.getenv('KEYSTORE_PASSWORD')
                      keyAlias 'ninja'
                      keyPassword System.getenv('KEYSTORE_PASSWORD')
                  }
              }

              buildTypes {
                  debug {
                      if (System.getenv('KEYSTORE_PASSWORD')) {
                          signingConfig signingConfigs.ninja
                      }
                  }
              }

              lintOptions {
                  abortOnError false
                  checkReleaseBuilds false
              }
          }

          dependencies {
              implementation fileTree(dir: 'libs', include: ['*.jar'])
          }
          EOF

      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/ninja.p12"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/ninja.p12" >> "$GITHUB_ENV"
            echo "Signing key found: APK will use the permanent key."
          else
            echo "::warning::KEYSTORE_B64 secret missing - APK will use a random debug key."
          fi

      - name: Build debug APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RUN_NUMBER: ${{ github.run_number }}
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ninja-debug-apk
          path: Ninja/build/outputs/apk/debug/*.apk