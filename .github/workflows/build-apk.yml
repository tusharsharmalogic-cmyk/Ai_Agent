name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK platform and build-tools
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME" || true
          ls "$ANDROID_HOME/cmdline-tools" || true
          java -version
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-22" "build-tools;30.0.3"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.6.4'

      - name: Generate Gradle wrapper files for the Ant-style Ninja project
        run: |
          cat > settings.gradle <<'EOF'
          rootProject.name = 'Ai_Agent'
          include ':app'
          project(':app').projectDir = file('Ninja')
          EOF

          cat > build.gradle <<'EOF'
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:7.4.2'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          cat > Ninja/build.gradle <<'EOF'
          apply plugin: 'com.android.application'

          android {
              namespace 'io.github.mthli.Ninja'
              compileSdkVersion 22
              buildToolsVersion '30.0.3'

              defaultConfig {
                  minSdkVersion 16
                  targetSdkVersion 22
                  versionCode 26
                  versionName '1.0'
              }

              sourceSets {
                  main {
                      manifest.srcFile 'AndroidManifest.xml'
                      java.srcDirs = ['src']
                      res.srcDirs = ['res']
                      assets.srcDirs = ['assets']
                  }
              }

              lintOptions {
                  abortOnError false
                  checkReleaseBuilds false
              }
          }

          dependencies {
              implementation fileTree(dir: 'libs', include: ['*.jar'])
          }
          EOF

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ninja-debug-apk
          path: Ninja/build/outputs/apk/debug/*.apk